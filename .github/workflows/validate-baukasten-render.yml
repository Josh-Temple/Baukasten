name: Validate Baukasten render

on:
  push:
    branches:
      - agent/add-app-links-screenshots

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Install Playwright
        run: |
          mkdir -p render-tmp
          cd render-tmp
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Serve and capture Baukasten
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/baukasten-preview.log 2>&1 &
          node <<'NODE'
          const { chromium, devices } = require('./render-tmp/node_modules/playwright');
          const fs = require('fs');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const pixel = devices['Pixel 7'];
            const context = await browser.newContext({
              ...pixel,
              locale: 'en-US',
            });
            const page = await context.newPage();

            let lastError;
            for (let i = 0; i < 30; i++) {
              try {
                await page.goto('http://127.0.0.1:4173/', { waitUntil: 'networkidle', timeout: 5000 });
                lastError = null;
                break;
              } catch (error) {
                lastError = error;
                await page.waitForTimeout(500);
              }
            }
            if (lastError) throw lastError;

            await page.screenshot({ path: 'baukasten-home-mobile.png', fullPage: true });

            const projectButtons = page.locator('button[aria-label^="View "]');
            const count = await projectButtons.count();
            if (count !== 7) throw new Error(`Expected 7 project cards, found ${count}`);

            for (let i = 0; i < count; i++) {
              const img = projectButtons.nth(i).locator('img');
              if (await img.count()) {
                const loaded = await img.evaluate(el => el.complete && el.naturalWidth > 0);
                if (!loaded) throw new Error(`Project card image ${i + 1} failed to load`);
              }
            }

            await projectButtons.nth(1).click();
            await page.waitForTimeout(300);
            await page.screenshot({ path: 'baukasten-engrave-detail-mobile.png', fullPage: true });

            const openApp = page.getByRole('link', { name: /Open app/i });
            if (await openApp.count() !== 1) throw new Error('Engrave Open app link missing');
            const href = await openApp.getAttribute('href');
            if (href !== 'https://engrave-theta.vercel.app/') throw new Error(`Unexpected Engrave href: ${href}`);

            const detailImage = page.locator('img[alt^="Engrave:"]');
            if (await detailImage.count() !== 1) throw new Error('Engrave detail screenshot missing');
            const detailLoaded = await detailImage.evaluate(el => el.complete && el.naturalWidth > 0);
            if (!detailLoaded) throw new Error('Engrave detail screenshot failed to load');

            fs.writeFileSync('render-check.txt', `cards=${count}\nengraveLink=${href}\nstatus=pass\n`);
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload render evidence
        uses: actions/upload-artifact@v4
        with:
          name: baukasten-render-check
          path: |
            baukasten-home-mobile.png
            baukasten-engrave-detail-mobile.png
            render-check.txt
          if-no-files-found: error
          retention-days: 1
