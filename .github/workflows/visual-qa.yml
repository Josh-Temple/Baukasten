name: Visual interface checks

on:
  pull_request:
    paths:
      - 'App.tsx'
      - 'components/**'
      - 'UI_GUIDELINES.md'
      - 'tests/browser-visual.mjs'
      - '.github/workflows/visual-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install browser runner
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run responsive browser checks
        run: node tests/browser-visual.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baukasten-responsive-screenshots
          path: visual-qa/
          if-no-files-found: ignore
          retention-days: 7
