name: Capture Baukasten screenshots

on:
  push:
    branches: [agent/add-app-links-screenshots]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          mkdir -p capture-tmp
          cd capture-tmp
          npm init -y
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture public app home screens
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { chromium, devices } = require('./capture-tmp/node_modules/playwright');

          const targets = [
            ['engrave', 'https://engrave-theta.vercel.app/'],
            ['majoris', 'https://majoris.vercel.app/'],
            ['parla', 'https://parla-teal.vercel.app/'],
            ['world-history-lab', 'https://world-history-lab.vercel.app/'],
            ['noema', 'https://noema-mu.vercel.app/'],
            ['lumen-commonplace', 'https://commonplace-sable.vercel.app/'],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              ...devices['Pixel 7'],
              locale: 'en-US',
            });

            for (const [id, url] of targets) {
              const outputDir = path.join('screenshots', id);
              fs.mkdirSync(outputDir, { recursive: true });
              const page = await context.newPage();
              await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
              await page.waitForLoadState('networkidle', { timeout: 10000 }).catch(() => {});
              await page.waitForTimeout(1200);
              console.log(`${id}: ${await page.title()} — ${page.url()}`);
              await page.screenshot({
                path: path.join(outputDir, '01_home.png'),
                fullPage: false,
              });
              await page.close();
            }

            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: baukasten-screenshots
          path: screenshots
          if-no-files-found: error
          retention-days: 1
